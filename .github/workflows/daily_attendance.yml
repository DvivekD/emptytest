name: VTU Campus.Life Autonomous Multi-Event Engine

on:
  schedule:
    # Test schedule (triggers at 04:58 UTC = 10:28 AM IST)
    - cron: '58 4 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action to run'
        required: true
        default: 'test_5min'
        type: choice
        options:
          - test_5min
          - checkin
          - checkout
          - status

permissions:
  contents: write

jobs:
  run-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Action
        id: determine_action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          else
            echo "action=test_5min" >> $GITHUB_OUTPUT
          fi

      - name: Execute Autonomous Test (Check-In -> Wait 5 Mins -> Check-Out)
        if: steps.determine_action.outputs.action == 'test_5min'
        run: |
          echo "=== STEP 1: EXECUTING CHECK-IN ==="
          python campus_life_auto.py --action checkin
          
          echo "=== STEP 2: WAITING 5 MINUTES (300 SECONDS) IN THE CLOUD ==="
          sleep 300
          
          echo "=== STEP 3: EXECUTING CHECK-OUT ==="
          python campus_life_auto.py --action checkout
          
          echo "=== STEP 4: PRINTING FINAL STATUS ==="
          python campus_life_auto.py --action status

      - name: Execute Single Action (checkin/checkout/status)
        if: steps.determine_action.outputs.action != 'test_5min'
        run: |
          ACTION="${{ steps.determine_action.outputs.action }}"
          python campus_life_auto.py --action "$ACTION"

      - name: Commit and Persist Progress
        run: |
          git config --global user.name "VTU Attendance Bot"
          git config --global user.email "bot@vtu-attendance.local"
          git add events_db.json attendance_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update event progress" && git push)
